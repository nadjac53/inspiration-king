name: 灵感大王-抖音热点抓取

on:
  schedule:
    # 每20分钟执行一次（UTC时间）
    - cron: '*/20 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 列出文件（调试用）
        run: ls -la

      - name: 执行爬虫
        run: python douyin_hotspot.py

      - name: 提交更新后的热点数据
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add hot.json
          git diff --staged --quiet || git commit -m "🤖 自动更新抖音热点数据"
          git push
