<button class="text-tertiary hover:opacity-80 transition-opacity">

</button>
</div>

<div class="flex flex-col items-center justify-center mt-4">

<span class="material-symbols-outlined text-6xl text-primary" data-icon="lightbulb" style="font-variation-settings: 'FILL' 1;">lightbulb</span>

</div>
<p class="font-headline font-semibold text-lg text-secondary tracking-wide">摇一摇 · 灵感降临</p>
